<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 A · 종이 (Paper)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --stage: #E9E5DC;
    --chrome: #F3F0EA;        /* 제목 표시줄(DWM 캡션 색), 메뉴 막대, 상태 표시줄 */
    --chrome-text: #2B2924;
    --caption-text: #4A463E;
    --chrome-line: #E4DFD5;
    --menu-active: #E4DFD4;
    --doc-bg: #FBFAF7;        /* 문서 이름 줄 */
    --editor-bg: #FFFEFB;
    --gutter-bg: #F7F5F0;
    --gutter-line: #ECE8DF;
    --line-num: #ADA697;
    --line-num-current: #23211D;
    --current-line: #F4F1EA;
    --selection: #CFE6E3;
    --text: #23211D;
    --accent: #0F6E6E;
    --accent-soft: #E3EFEE;
    --popup-bg: #FFFFFF;
    --popup-line: #DDD7CB;
    --popup-sep: #ECE8DF;
    --popup-hover-bg: #E3EFEE;
    --popup-hover-text: #0F6E6E;
    --accel: #8A8476;
    --disabled: #B9B2A4;
    --status-text: #5B564C;
    --status-sep: #DDD7CB;
    --muted: #6B665B;
    --ui-font: 'IBM Plex Sans KR', sans-serif;
    --mono-font: 'D2Coding', 'Nanum Gothic Coding', monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--stage); font-family: var(--ui-font); color: var(--text); }
  .stage { display: flex; flex-wrap: wrap; gap: 40px; padding: 40px; }
  .window { position: relative; width: 1000px; max-width: 100%; height: 780px; display: flex; flex-direction: column;
    background: var(--doc-bg); border: 1px solid #D6D0C4; border-radius: 10px; overflow: hidden;
    box-shadow: 0 18px 40px rgba(60,50,30,.16); }
  .caption { height: 40px; display: flex; align-items: center; gap: 10px; padding-left: 14px; background: var(--chrome);
    font: 13px 'Segoe UI', 'Malgun Gothic', sans-serif; color: var(--caption-text); }
  .caption .t { flex: 1; }
  .caption .ctl { width: 46px; height: 40px; display: grid; place-items: center; }
  .menubar { height: 38px; display: flex; align-items: center; gap: 2px; padding: 0 8px; background: var(--chrome);
    border-bottom: 1px solid var(--chrome-line); }
  .menubar div { font-size: 15px; font-weight: 500; padding: 6px 12px; border-radius: 6px; color: var(--chrome-text); }
  .menubar .on { background: var(--menu-active); }
  .docbar { height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 20px; border-bottom: 1px solid var(--gutter-line); }
  .docbar .name { font-size: 17px; font-weight: 600; }
  .docbar .chip { font-size: 12px; font-weight: 500; color: var(--accent); background: var(--accent-soft); padding: 3px 9px; border-radius: 999px; }
  .editor { flex: 1; display: flex; min-height: 0; background: var(--editor-bg); }
  .gutter { width: 52px; padding-top: 12px; background: var(--gutter-bg); border-right: 1px solid var(--gutter-line); }
  .gutter div { height: 28px; line-height: 28px; text-align: right; padding-right: 12px; font: 14px var(--mono-font); color: var(--line-num); }
  .gutter .cur { color: var(--line-num-current); font-weight: 700; }
  .text { flex: 1; padding-top: 12px; font: 16px var(--mono-font); }
  .text div { height: 28px; line-height: 28px; padding-left: 16px; white-space: pre; }
  .text .cur { background: var(--current-line); }
  .text .sel { background: var(--selection); }
  .status { height: 30px; display: flex; align-items: center; background: var(--chrome); border-top: 1px solid var(--chrome-line);
    font-size: 13px; color: var(--status-text); }
  .status .fill { flex: 1; }
  .status div:not(.fill) { padding-left: 12px; border-left: 1px solid var(--status-sep); }
  .popup { position: absolute; left: 76px; top: 74px; width: 290px; padding: 6px 0; background: var(--popup-bg);
    border: 1px solid var(--popup-line); border-radius: 8px; box-shadow: 0 10px 28px rgba(60,50,30,.18); }
  .popup .sep { height: 1px; margin: 5px 10px; background: var(--popup-sep); }
  .popup .row { display: flex; align-items: center; height: 34px; margin: 0 6px; padding: 0 12px; border-radius: 6px; font-size: 14.5px; }
  .popup .row span:first-child { flex: 1; }
  .popup .acc { font-size: 13px; color: var(--accel); }
  .popup .hover { background: var(--popup-hover-bg); color: var(--popup-hover-text); font-weight: 500; }
  .popup .off, .popup .off .acc { color: var(--disabled); }
  u { text-underline-offset: 2px; }
  .spec { width: 300px; display: flex; flex-direction: column; gap: 28px; }
  .spec h1 { margin: 4px 0 0; font-size: 30px; }
  .spec .kicker { font-size: 13px; font-weight: 600; letter-spacing: .08em; color: var(--accent); }
  .spec p { margin: 6px 0 0; font-size: 15px; line-height: 1.6; color: #4A463E; }
  .spec h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .icons { display: flex; align-items: flex-end; gap: 18px; }
  .icons .dark { background: #202020; border-radius: 8px; padding: 8px; display: flex; }
  .card { background: var(--doc-bg); border: 1px solid var(--popup-line); border-radius: 8px; padding: 14px 16px; }
  .card .big { font-size: 22px; font-weight: 600; }
  .card small { display: block; font-size: 13px; color: var(--muted); }
  .card hr { border: 0; border-top: 1px solid var(--popup-sep); margin: 10px 0; }
  .swatches { display: flex; gap: 10px; }
  .swatches div { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
  .swatches i { width: 52px; height: 52px; border-radius: 8px; border: 1px solid rgba(0,0,0,.12); }
</style>
</head>
<body>
<div class="stage">
  <div class="window">
    <div class="caption">
      <img src="icons/icon-a-paper.svg" width="18" height="18" alt="">
      <span class="t">*제목 없음 - Windows 메모장</span>
      <span class="ctl"><svg width="10" height="10" aria-hidden="true"><path d="M0 5h10" stroke="currentColor"/></svg></span>
      <span class="ctl"><svg width="10" height="10" aria-hidden="true"><rect x=".5" y=".5" width="9" height="9" rx="1.5" fill="none" stroke="currentColor"/></svg></span>
      <span class="ctl"><svg width="10" height="10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor"/></svg></span>
    </div>
    <div class="menubar" id="menubar"></div>
    <div class="docbar"><span class="name">제목 없음</span><span class="chip">수정됨</span></div>
    <div class="editor"><div class="gutter" id="gutter"></div><div class="text" id="text"></div></div>
    <div class="status">
      <div class="fill"></div><div style="width:150px">줄 3, 열 30</div><div style="width:70px">100%</div>
      <div style="width:130px">Windows (CRLF)</div><div style="width:90px">UTF-8</div>
    </div>
    <div class="popup" id="popup"></div>
  </div>

  <div class="spec">
    <div><div class="kicker">시안 A</div><h1>종이 (Paper)</h1>
      <p>따뜻한 미색 바탕에 짙은 청록 포인트. 종이 위에 쓰는 느낌의 차분한 화면.</p></div>
    <div><h2>아이콘</h2>
      <div class="icons">
        <img src="icons/icon-a-paper.svg" width="112" height="112" alt="종이 아이콘">
        <img src="icons/icon-a-paper.svg" width="48" height="48" alt="">
        <span class="dark"><img src="icons/icon-a-paper.svg" width="24" height="24" alt=""></span>
      </div></div>
    <div><h2>글꼴</h2>
      <div class="card"><div class="big">IBM Plex Sans KR</div><small>메뉴·문서 이름·상태 표시줄 — 15px / 500</small><hr>
        <div class="big" style="font-family: var(--mono-font); font-weight: 400">D2Coding 유지</div><small>본문(편집 영역) — 지금과 동일</small></div></div>
    <div><h2>색</h2>
      <div class="swatches">
        <div><i style="background:#FBFAF7"></i>#FBFAF7</div><div><i style="background:#F3F0EA"></i>#F3F0EA</div>
        <div><i style="background:#23211D"></i>#23211D</div><div><i style="background:#0F6E6E"></i>#0F6E6E</div>
      </div></div>
  </div>
</div>

<script>
  // 메뉴 막대, 본문 줄, 편집 메뉴 항목은 반복되는 부분이라 데이터로 그린다 (시안 B와 같은 구조).
  const menus = [['파일', 'F'], ['편집', 'E', true], ['서식', 'O'], ['보기', 'V']];
  document.getElementById('menubar').innerHTML = menus
    .map(([l, k, on]) => `<div class="${on ? 'on' : ''}">${l}(<u>${k}</u>)</div>`).join('');

  const lines = [
    ['# 10월 프로젝트 메모'], [''], ['- 메뉴 이름을 ', 'Google로 검색', '으로 바꿈'],
    ['- 줄 번호, 마크다운 미리 보기 확인'], ['- 다음 할 일: 새 아이콘과 UI 글꼴 적용'], [''],
    ['회의: 10월 20일 오후 3시'], ['참석: 디자인, 개발'], ['']
  ];
  const CURRENT = 2;
  document.getElementById('gutter').innerHTML = lines
    .map((_, i) => `<div class="${i === CURRENT ? 'cur' : ''}">${i + 1}</div>`).join('');
  document.getElementById('text').innerHTML = lines
    .map(([pre, sel = '', post = ''], i) =>
      `<div class="${i === CURRENT ? 'cur' : ''}">${pre}<span class="sel">${sel}</span>${post}</div>`).join('');

  const items = [
    ['실행 취소', 'U', '', 'Ctrl+Z'], null,
    ['잘라내기', 'T', '', 'Ctrl+X'], ['복사', 'C', '', 'Ctrl+C'], ['붙여넣기', 'P', '', 'Ctrl+V'], ['삭제', 'L', '', 'Del'], null,
    ['Google로 검색', 'S', '...', 'Ctrl+E', 'hover'], ['찾기', 'F', '...', 'Ctrl+F'],
    ['다음 찾기', 'N', '', 'F3', 'off'], ['이전 찾기', 'V', '', 'Shift+F3', 'off'],
    ['바꾸기', 'R', '...', 'Ctrl+H'], ['이동', 'G', '...', 'Ctrl+G'], null,
    ['모두 선택', 'A', '', 'Ctrl+A'], ['시간/날짜', 'D', '', 'F5']
  ];
  document.getElementById('popup').innerHTML = items
    .map((it) => !it ? '<div class="sep"></div>' :
      `<div class="row ${it[4] || ''}"><span>${it[0]}(<u>${it[1]}</u>)${it[2]}</span><span class="acc">${it[3]}</span></div>`).join('');
</script>
</body>
</html>
