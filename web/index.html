<!doctype html>
<html lang="ko" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="브라우저에서 쓰는 메모장. 텍스트·마크다운 파일 열기/저장, 찾기·바꾸기, 줄 번호, 마크다운 미리 보기, 종이·슬레이트 테마.">
<meta name="theme-color" content="#F3F0EA">
<title>제목 없음 - 메모장</title>
<link rel="icon" id="favicon" type="image/svg+xml" href="icons/icon-paper.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Sans+KR:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div id="app">
  <header class="menubar" id="menubar">
    <nav class="menus" id="menus" aria-label="메뉴"></nav>
    <button type="button" class="preview-button" id="preview-button" hidden></button>
    <button type="button" class="theme-box" id="theme-button" aria-haspopup="menu"></button>
  </header>

  <div class="docbar" id="docbar">
    <div class="doc-holder">
      <span class="doc-name" id="doc-name"></span>
      <span class="doc-dirty" id="doc-dirty" hidden></span>
    </div>
  </div>

  <main class="editor" id="editor">
    <div class="gutter-bg"></div>
    <div class="mirror" id="mirror" aria-hidden="true"></div>
    <textarea id="text" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off"
              wrap="off" aria-label="본문"></textarea>
    <article class="preview" id="preview" tabindex="0" hidden></article>
  </main>

  <footer class="status" id="status">
    <span class="fill"></span>
    <span class="cell pos" id="st-pos"></span>
    <span class="cell zoom" id="st-zoom"></span>
    <span class="cell eol" id="st-eol"></span>
    <span class="cell enc" id="st-enc"></span>
  </footer>
</div>

<div id="popup-layer"></div>

<!-- 찾기 / 바꾸기 (modeless) -->
<section class="panel" id="find-panel" role="dialog" aria-labelledby="find-title" hidden>
  <h2 class="panel-title" id="find-title">찾기</h2>
  <div class="find-body">
    <div class="find-fields">
      <label for="find-what">찾을 내용(<u>N</u>):</label>
      <input id="find-what" type="text" autocomplete="off" spellcheck="false">
      <label for="find-with" class="replace-only">바꿀 내용(<u>P</u>):</label>
      <input id="find-with" type="text" autocomplete="off" spellcheck="false" class="replace-only">
      <div class="find-options">
        <div class="checks">
          <label><input type="checkbox" id="opt-word"> 단어 단위로(<u>W</u>)</label>
          <label><input type="checkbox" id="opt-case"> 대/소문자 구분(<u>C</u>)</label>
          <label><input type="checkbox" id="opt-wrap"> 주위에 배치(<u>R</u>)</label>
        </div>
        <fieldset class="direction find-only">
          <legend>방향</legend>
          <label><input type="radio" name="direction" value="up"> 위로(<u>U</u>)</label>
          <label><input type="radio" name="direction" value="down"> 아래로(<u>D</u>)</label>
        </fieldset>
      </div>
    </div>
    <div class="find-buttons">
      <button type="button" class="primary" id="btn-find-next">다음 찾기(<u>F</u>)</button>
      <button type="button" class="replace-only" id="btn-replace">바꾸기(<u>R</u>)</button>
      <button type="button" class="replace-only" id="btn-replace-all">모두 바꾸기(<u>A</u>)</button>
      <button type="button" id="btn-find-close">취소</button>
    </div>
  </div>
</section>

<!-- 메시지 / 저장 확인 -->
<dialog class="modal" id="message-dialog">
  <form method="dialog">
    <h2 class="panel-title">메모장</h2>
    <p class="message" id="message-text"></p>
    <div class="buttons" id="message-buttons"></div>
  </form>
</dialog>

<!-- 줄 이동 -->
<dialog class="modal" id="goto-dialog">
  <form method="dialog" id="goto-form">
    <h2 class="panel-title">줄 이동</h2>
    <label for="goto-line">줄 번호(<u>L</u>):</label>
    <input id="goto-line" type="text" inputmode="numeric" autocomplete="off">
    <div class="buttons">
      <button class="primary" value="ok">이동</button>
      <button value="cancel" formnovalidate>취소</button>
    </div>
  </form>
</dialog>

<!-- 다른 이름으로 저장: 인코딩 (파일 이름 칸은 파일 선택 창을 쓸 수 없는 브라우저에서만 보인다) -->
<dialog class="modal" id="save-dialog">
  <form method="dialog" id="save-form">
    <h2 class="panel-title">다른 이름으로 저장</h2>
    <div class="grid">
      <label for="save-name" class="name-row">파일 이름(<u>N</u>):</label>
      <input id="save-name" type="text" autocomplete="off" spellcheck="false" class="name-row">
      <label for="save-encoding">인코딩(<u>E</u>):</label>
      <select id="save-encoding"></select>
    </div>
    <div class="buttons">
      <button class="primary" value="ok">저장(<u>S</u>)</button>
      <button value="cancel" formnovalidate>취소</button>
    </div>
  </form>
</dialog>

<!-- 글꼴 -->
<dialog class="modal" id="font-dialog">
  <form method="dialog" id="font-form">
    <h2 class="panel-title">글꼴</h2>
    <div class="grid">
      <label for="font-family">글꼴(<u>F</u>):</label>
      <input id="font-family" type="text" list="font-families" autocomplete="off" spellcheck="false">
      <label for="font-size">크기(<u>S</u>):</label>
      <select id="font-size"></select>
    </div>
    <datalist id="font-families"></datalist>
    <fieldset class="sample">
      <legend>보기</legend>
      <div id="font-sample">AaBbYyZz 가나다라 0123</div>
    </fieldset>
    <div class="buttons">
      <button class="primary" value="ok">확인</button>
      <button value="cancel" formnovalidate>취소</button>
    </div>
  </form>
</dialog>

<input type="file" id="file-input" accept=".txt,.md,.markdown,text/*" hidden>
<pre id="print-area"></pre>
</body>
</html>
